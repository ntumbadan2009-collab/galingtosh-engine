name: Stable reconstruction checks
on:
  pull_request:
    branches: [main]
  push:
    branches: [rebuild/stable-2026-11-26]
permissions:
  contents: read
jobs:
  agent:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - run: deno check supabase/functions/chat-agent/index.ts
      - run: deno test --allow-env supabase/functions/chat-agent/stable_rebuild_test.ts supabase/functions/chat-agent/research_test.ts supabase/functions/chat-agent/production_test.ts supabase/functions/chat-agent/proposal-intents.test.ts
