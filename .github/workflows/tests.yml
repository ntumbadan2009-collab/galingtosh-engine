name: Engine tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  pytest:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PYTHONPATH: ${{ github.workspace }}
      ENGINE_SHARED_SECRET: ci-test-secret
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Verify FFmpeg
        run: |
          if ! command -v ffmpeg >/dev/null || ! command -v ffprobe >/dev/null; then
            sudo apt-get update -o Acquire::Retries=1 -o Acquire::http::Timeout=15
            sudo apt-get install -y --no-install-recommends ffmpeg
          fi
          ffmpeg -version | head -1
          ffprobe -version | head -1
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Run tests
        run: pytest -q


      - name: Set up Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Test film operations
        run: deno test supabase/functions/chat-agent/film_test.ts supabase/functions/chat-agent/narrative.test.ts supabase/functions/chat-agent/motion.test.ts supabase/functions/chat-agent/editorial_test.ts supabase/functions/chat-agent/production_test.ts supabase/functions/chat-agent/cinematic_test.ts supabase/functions/chat-agent/creative_test.ts supabase/functions/chat-agent/cinematic_repair_test.ts supabase/functions/chat-agent/sound_test.ts supabase/functions/chat-agent/research_test.ts
      - name: Check Edge functions
        run: deno check supabase/functions/chat-agent/index.ts supabase/functions/request-render/index.ts supabase/functions/search-media/index.ts
